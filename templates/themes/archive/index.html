<!doctype html>
<head>
    <meta http-equiv="Content-type" content="text/html; charset=utf-8" />
    <link rel="stylesheet" media="screen" href="{{ config.root }}{{ settings.css }}"/>
    <title>arc - Archive</title>
    {% include 'header.html' %}
</head>

<body>
    {{ boardlist.top }}
    <header>
		<h1>/arc/ - Archive</h1>
	</header>

	<form id="query_form" style="margin-bottom: 1em;text-align: center;">
        Board: <select style="margin-right: 2ch;width: 23ch;" name="board">
        <option value="" selected>All boards</option>
        <option value="an">/an/ - Anime</option>
        <option value="fb">/fb/ - Feedback</option>
        <option value="ma">/ma/ - Manga</option>
        <option value="mai">/mai/ - Waifu</option>
        <option value="ot">/ot/ - Otaku Tangents</option>
        <option value="so">/so/ - Ronery</option>
        <option value="test">/test/ - Test</option>
        <option value="vg">/vg/ - Video Games</option></select>
        Start: <input type="date" name="start_date" style="margin-right: 2ch;">
        End: <input type="date" name="end_date" style="margin-right: 2ch;">
        Text: <input type="text" name="text_query" style="margin-right: 2ch;">
        <input type="submit" value="Search">
	</form>

	<table id="query_display" style="width: 100%;">
	<tbody>
	    <tr><th><div class="tabletop2">Archived Posts</div></th></tr>
		{% for thread in threads %}
		<tr class="archived_thread"><td>
		    <div class="tablesub" style="font-size: 12pt;display: flex;justify-content: space-between;">
				<a title="{{ thread.first_post }}" href="/kusaba_arc/{{ thread.board }}/res/{{ thread.id }}.html">/{{ thread.board }}/ {{ thread.date }} : {{ thread.subject }} : {{thread.snippet }}</a>
				<div style="display: inline;padding-left: 1ch;">[{{ thread.replies }} replies]</div>
			</div></td></tr>
		{% endfor %}
	</tbody>
	</table>
	{% include 'footer.html' %}
</body>

<script>
  const end_point = "/kusaba_query.php";

  const query_display = document.getElementById("query_display");

  const form = document.getElementById("query_form");
  form.addEventListener("submit", (event) => {
    event.preventDefault();
    query_archive();
  });

  async function query_archive() {
    const formData = new FormData(form);

    try {
      const response = await fetch(end_point, {
        method: "POST",
        body: formData,
        cache: "no-cache"
      });

      const query_results = await response.json();

      Array.from(query_display.querySelectorAll(".archived_thread")).forEach(node => {
        node.remove();
      });

      query_results.results.forEach(thread => {
          const new_row = query_display.insertRow(-1);
          new_row.className = 'archived_thread';
          const new_cell = new_row.insertCell(0);
          const template = document.createElement('template');

          const new_content = `<div class="tablesub" style="font-size: 12pt;display: flex;justify-content: space-between;">
				<a title="${ thread.first_post }" href="/kusaba_arc/${ thread.board }/res/${ thread.id }.html">/${ thread.board }/ ${ thread.date } : ${ thread.subject } : ${thread.snippet }</a>
				<div style="display: inline;padding-left: 1ch;">[${ thread.replies } replies]</div>
			</div>`;

          template.innerHTML = new_content;
          new_cell.appendChild(template.content.childNodes[0]);
      });


    } catch (e) {
      console.error(e);
    }
  }
</script>
