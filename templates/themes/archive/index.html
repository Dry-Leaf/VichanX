<!doctype html>
<head>
    <meta http-equiv="Content-type" content="text/html; charset=utf-8" />
    <link rel="stylesheet" media="screen" href="{{ config.root }}{{ settings.css }}"/>
    <title>arc - Archive</title>
    {% include 'header.html' %}
</head>

<body>
    {{ boardlist.top }}
    <header>
		<h1>/arc/ - Archive</h1>
	</header>

	<table>
	<tbody>
	    <tr background><th><div class="tabletop2">Archived Posts</div></th></tr>x
		{% for thread in threads %}
		<tr><td>
		    <div class="tablesub">
				<a href="/kusaba_arc/{{ thread.board }}/res/{{ thread.id }}.html">/{{ thread.board }}/ - {{ thread.date }} - {{ thread.subject }} - {{thread.snippet }}&nbps;</a>
				[{{ thread.replies }} replies]
			</div></td></tr>
		{% endfor %}
		{% include 'footer.html' %}
	</tbody>
	</table>
</body>
